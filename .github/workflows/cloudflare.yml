name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: e480701d9e4150072f4f9a09b43e9749
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Cloudflare token is present
        env:
          TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
          TOKEN_VAR: ${{ vars.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN_VAR" ] && [ -z "$TOKEN_SECRET" ] && [ -z "$TOKEN_ALT" ]; then
            echo "CLOUDFLARE_API_TOKEN is a Variable. Move it to Secrets."
            echo "Open: https://github.com/Salaroutsourcing/sk-immigration-website/settings/secrets/actions"
            echo "New repository secret → name CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$TOKEN_SECRET" ] && [ -z "$TOKEN_ALT" ]; then
            echo "GitHub did not find CLOUDFLARE_API_TOKEN."
            echo "Open: https://github.com/Salaroutsourcing/sk-immigration-website/settings/secrets/actions"
            echo "It must be a Repository secret (not a Variable), name exactly CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "Cloudflare token secret is set."
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Deploy Worker + assets
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          accountId: e480701d9e4150072f4f9a09b43e9749
          command: deploy
