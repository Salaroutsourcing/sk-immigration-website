name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check Cloudflare token is present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty."
            echo "Add it as a Repository secret (Settings → Secrets and variables → Actions → Secrets)."
            echo "Do not add it as a Variable."
            echo "The name must be exactly CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is set."
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Deploy Worker + assets
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'e480701d9e4150072f4f9a09b43e9749' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'e480701d9e4150072f4f9a09b43e9749' }}
          command: deploy
