<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="visitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#visitGrad)" />
  <circle cx="400" cy="225" r="300" fill="url(#glow4)" />

  <!-- Flight Path Dashes & World Contours -->
  <g opacity="0.2" stroke="#ffffff" stroke-width="2" fill="none">
    <ellipse cx="400" cy="225" rx="260" ry="120" stroke-dasharray="10 8" />
    <circle cx="400" cy="225" r="160" />
  </g>

  <!-- Central Elements: Modern Airplane & Globe -->
  <g transform="translate(400, 195)">
    <!-- Globe outline -->
    <circle cx="0" cy="15" r="65" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="4" />
    <ellipse cx="0" cy="15" rx="30" ry="65" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6" />
    <line x1="-65" y1="15" x2="65" y2="15" stroke="#ffffff" stroke-width="3" opacity="0.6" />

    <!-- Sleek Aircraft -->
    <path d="M-15 -35 L15 -35 L45 0 L15 15 L25 45 L0 35 L-25 45 L-15 15 L-45 0 Z" fill="#ffffff" transform="rotate(45)" filter="drop-shadow(0 8px 16px rgba(0,0,0,0.2))" />
  </g>

  <!-- Destination Pills -->
  <g transform="translate(200, 360)">
    <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🇬🇧 UK Visit</text>
  </g>
  <g transform="translate(340, 360)">
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🇪🇺 Schengen</text>
  </g>
  <g transform="translate(480, 360)">
    <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🇺🇸 US B1/B2</text>
  </g>
  <g transform="translate(615, 360)">
    <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🇦🇪 Dubai</text>
  </g>
</svg>
