<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="studyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#studyGrad)" />
  <circle cx="400" cy="225" r="300" fill="url(#glow)" />
  
  <!-- Subtle decorative grid & circles -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="400" cy="225" r="180" />
    <circle cx="400" cy="225" r="120" />
    <line x1="100" y1="225" x2="700" y2="225" />
    <line x1="400" y1="50" x2="400" y2="400" />
  </g>

  <!-- Graphic Elements: Graduation Cap, Globe, Book -->
  <g transform="translate(400, 200)">
    <!-- Graduation Cap -->
    <path d="M0 -70 L110 -25 L0 20 L-110 -25 Z" fill="#ffffff" />
    <path d="M-80 -10 L-80 35 Q0 75 80 35 L80 -10 Q0 30 -80 -10 Z" fill="#e2e8f0" opacity="0.9" />
    <!-- Tassel -->
    <path d="M90 -18 L115 25 L115 50" stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round" />
    <circle cx="115" cy="55" r="6" fill="#fbbf24" />
  </g>

  <!-- Badges / Country Tags -->
  <g transform="translate(180, 360)">
    <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🇩🇪 Germany</text>
  </g>
  <g transform="translate(325, 360)">
    <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🇬🇧 UK</text>
  </g>
  <g transform="translate(470, 360)">
    <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🇨🇦 Canada</text>
  </g>
  <g transform="translate(615, 360)">
    <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🇮🇹 Italy</text>
  </g>
</svg>
