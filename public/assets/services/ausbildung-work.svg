<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ausbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="deGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="deRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ausbGrad)" />
  <circle cx="400" cy="225" r="300" fill="url(#glow2)" />

  <!-- Background decorative lines -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <circle cx="400" cy="225" r="160" />
    <circle cx="400" cy="225" r="110" />
    <path d="M150 100 L650 350 M150 350 L650 100" />
  </g>

  <!-- German Tri-color Ribbon Accent -->
  <g transform="translate(400, 70)">
    <rect x="-80" y="-8" width="160" height="5" fill="#111827" rx="2" />
    <rect x="-80" y="-3" width="160" height="5" fill="url(#deRed)" rx="2" />
    <rect x="-80" y="2" width="160" height="5" fill="url(#deGold)" rx="2" />
  </g>

  <!-- Main Central Icon: Briefcase, Gear, Certificate -->
  <g transform="translate(400, 205)">
    <!-- Gear -->
    <circle cx="-55" cy="-20" r="35" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="12 6" opacity="0.8" />
    <circle cx="-55" cy="-20" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />

    <!-- Medical / Health Cross Symbol -->
    <rect x="40" y="-35" width="30" height="10" rx="3" fill="#10b981" />
    <rect x="50" y="-45" width="10" height="30" rx="3" fill="#10b981" />

    <!-- Modern Briefcase -->
    <rect x="-60" y="5" width="120" height="75" rx="14" fill="#ffffff" fill-opacity="0.9" />
    <path d="M-25 5 L-25 -10 Q0 -22 25 -10 L25 5" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <rect x="-60" y="28" width="120" height="6" fill="#cbd5e1" />
    <circle cx="0" cy="45" r="7" fill="url(#deGold)" />
  </g>

  <!-- Stipend Badge Callout -->
  <g transform="translate(400, 360)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">€600 – €1,200 Monthly Stipend · €0 Tuition</text>
  </g>
</svg>
