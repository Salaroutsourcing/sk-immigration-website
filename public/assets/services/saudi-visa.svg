<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="saudiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#saudiGrad)" />
  <circle cx="400" cy="225" r="300" fill="url(#glow3)" />

  <!-- Geometric Pattern Lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5" fill="none">
    <rect x="250" y="75" width="300" height="300" rx="20" transform="rotate(45 400 225)" />
    <circle cx="400" cy="225" r="160" />
  </g>

  <!-- Central Graphic: Shield, Passport, Checkmark -->
  <g transform="translate(400, 195)">
    <!-- Security Shield -->
    <path d="M0 -60 Q55 -40 70 10 Q65 75 0 100 Q-65 75 -70 10 Q-55 -40 0 -60 Z" fill="#ffffff" />
    <!-- Inner emblem -->
    <path d="M0 -45 Q40 -30 52 8 Q48 60 0 80 Q-48 60 -52 8 Q-40 -30 0 -45 Z" fill="#047857" />
    <!-- Checkmark -->
    <path d="M-20 15 L-6 30 L25 -8" fill="none" stroke="url(#goldAcc)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Fixed Fee Badge Callout -->
  <g transform="translate(400, 360)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.5"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Fixed Consultancy: PKR 15,000</text>
  </g>
</svg>
