    <line x1="-50" y1="-10" x2="-15" y2="-10" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="-50" y1="10" x2="-20" y2="10" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
