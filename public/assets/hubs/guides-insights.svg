    <line x1="15" y1="-10" x2="50" y2="-10" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="15" y1="10" x2="45" y2="10" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
