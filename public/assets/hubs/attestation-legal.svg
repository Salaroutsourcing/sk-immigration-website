<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gAttest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gGoldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="36" fill="url(#gAttest)" />
  <!-- Document & Official Gold Seal -->
  <g transform="translate(250, 215)">
    <rect x="-65" y="-75" width="130" height="165" rx="10" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.35))" />
    <line x1="-40" y1="-45" x2="40" y2="-45" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="-40" y1="-25" x2="40" y2="-25" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="-40" y1="-5" x2="20" y2="-5" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="-40" y1="15" x2="30" y2="15" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <g transform="translate(25, 45)">
      <path d="M-8 12 L-16 35 L0 28 L16 35 L8 12 Z" fill="#ef4444" />
      <circle cx="0" cy="0" r="26" fill="url(#gGoldSeal)" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3 2" />
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#78350f" text-anchor="middle">MOFA</text>
