<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Admin | SK Immigration</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"></div>
  <div id="loginGate" class="container" style="min-height:100vh;display:grid;place-items:center">
    <form id="loginForm" class="glass card" style="width:min(400px,100%)">
      <h1 class="display" style="font-size:1.5rem;margin-bottom:0.75rem">Blog Admin</h1>
      <div class="form-group"><label>Password</label><input class="form-control" type="password" id="adminPass" required /></div>
      <button class="btn btn-gold w-full" type="submit">Sign in</button>
      <div class="form-msg" id="loginMsg"></div>
    </form>
  </div>

  <div id="adminApp" class="admin-shell hidden">
    <aside class="admin-side">
      <div class="logo mb-2"><span class="logo-mark">SK</span><span>Blog</span></div>
      <nav class="admin-nav">
        <a href="index.html">Dashboard</a>
        <a href="blog.html" class="active">Blog admin</a>
        <a href="jobs.html">Jobs admin</a>
        <a href="../blog.html">View public blog</a>
        <a href="#" id="logoutBtn">Log out</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="flex justify-between items-center flex-wrap gap-2 mb-2">
        <h1 class="display" style="font-size:1.6rem">Manage posts</h1>
        <button class="btn btn-gold btn-sm" id="newPost">+ New post</button>
      </div>
      <div class="table-wrap glass card">
        <table class="data">
          <thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Actions</th></tr></thead>
          <tbody id="postsBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="editModal">
    <div class="modal glass-strong" style="width:min(720px,100%)">
      <h2 id="modalTitle" style="font-family:var(--font-display);margin-bottom:1rem">Edit post</h2>
      <form id="postForm">
        <input type="hidden" name="id" id="postId" />
        <div class="form-row">
          <div class="form-group"><label>Title *</label><input class="form-control" name="title" id="postTitle" required /></div>
          <div class="form-group"><label>Slug *</label><input class="form-control" name="slug" id="postSlug" required /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Category</label><input class="form-control" name="category" id="postCat" /></div>
          <div class="form-group"><label>Date</label><input class="form-control" name="date" id="postDate" type="date" /></div>
        </div>
        <div class="form-group"><label>Excerpt</label><textarea class="form-control" name="excerpt" id="postExcerpt"></textarea></div>
        <div class="form-group"><label>Content (HTML allowed)</label><textarea class="form-control" name="content" id="postContent" style="min-height:180px"></textarea></div>
        <div class="form-group"><label>Author</label><input class="form-control" name="author" id="postAuthor" value="SK Immigration" /></div>
        <div class="flex gap-2">
          <button class="btn btn-gold" type="submit">Save post</button>
          <button class="btn btn-ghost" type="button" id="cancelEdit">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/blog.js"></script>
  <script>
    async function render() {
      const posts = await SalarBlog.getAll();
      document.getElementById('postsBody').innerHTML = posts.map(p => `
        <tr>
          <td>${p.date||''}</td>
          <td>${p.title}</td>
          <td>${p.category||''}</td>
          <td class="flex gap-2">
            <button class="btn btn-ghost btn-sm" data-edit="${p.id}">Edit</button>
            <button class="btn btn-ghost btn-sm" data-del="${p.id}">Delete</button>
          </td>
        </tr>`).join('');
      document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(posts.find(p => p.id === b.dataset.edit))));
      document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('Delete this post?')) return;
        await SalarBlog.deletePost(b.dataset.del);
        render();
      }));
    }

    function slugify(t) {
      return t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    }

    function openEdit(post) {
      document.getElementById('modalTitle').textContent = post ? 'Edit post' : 'New post';
      document.getElementById('postId').value = post?.id || '';
      document.getElementById('postTitle').value = post?.title || '';
      document.getElementById('postSlug').value = post?.slug || '';
      document.getElementById('postCat').value = post?.category || 'Guides';
      document.getElementById('postDate').value = post?.date || new Date().toISOString().slice(0,10);
      document.getElementById('postExcerpt').value = post?.excerpt || '';
      document.getElementById('postContent').value = post?.content || '';
      document.getElementById('postAuthor').value = post?.author || 'SK Immigration';
      document.getElementById('editModal').classList.add('open');
    }

    document.getElementById('postTitle')?.addEventListener('input', (e) => {
      if (!document.getElementById('postId').value) document.getElementById('postSlug').value = slugify(e.target.value);
    });

    document.getElementById('postForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const post = {
        id: fd.get('id') || ('post_' + Date.now().toString(36)),
        title: fd.get('title'),
        slug: fd.get('slug'),
        category: fd.get('category'),
        date: fd.get('date'),
        excerpt: fd.get('excerpt'),
        content: fd.get('content'),
        author: fd.get('author'),
        tags: [],
        featured: false,
      };
      await SalarBlog.savePost(post);
      document.getElementById('editModal').classList.remove('open');
      render();
    });

    document.getElementById('newPost')?.addEventListener('click', () => openEdit(null));
    document.getElementById('cancelEdit')?.addEventListener('click', () => document.getElementById('editModal').classList.remove('open'));
    document.getElementById('editModal')?.addEventListener('click', (e) => { if (e.target.id === 'editModal') e.target.classList.remove('open'); });

    document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const ok = await SalarAPI.loginAdmin(document.getElementById('adminPass').value);
      if (ok) {
        document.getElementById('loginGate').classList.add('hidden');
        document.getElementById('adminApp').classList.remove('hidden');
        render();
      } else {
        const msg = document.getElementById('loginMsg');
        msg.className = 'form-msg show err';
        msg.textContent = 'Incorrect password.';
      }
    });
    document.getElementById('logoutBtn')?.addEventListener('click', (e) => { e.preventDefault(); SalarAPI.logoutAdmin(); location.reload(); });
    if (SalarAPI.isAdminLoggedIn()) {
      document.getElementById('loginGate').classList.add('hidden');
      document.getElementById('adminApp').classList.remove('hidden');
      render();
    }
  </script>
</body>
</html>
