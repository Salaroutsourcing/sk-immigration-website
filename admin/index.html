<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leads | SK Admin</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/admin.css?v=light1" />
</head>
<body data-admin-page="leads">
  <script src="../assets/js/config.js?v=light1"></script>
  <script src="../assets/js/api.js?v=light1"></script>
  <script src="../assets/js/admin-shell.js?v=light1"></script>
  <script>
    const STATUSES = ['new', 'contacted', 'in_progress', 'won', 'lost', 'archived'];
    let snapshot = { leads: [] };
    let activeId = null;
    let serviceFilter = '';

    AdminShell.mountShell({
      title: 'All leads',
      subtitle: 'Every enquiry from study, appointments, Saudi, jobs, attestation, hire portal, CV and contact forms.',
      async render({ content, actions, esc, statusBadge, whatsappLink, typeLabel, SERVICES, filterLeads }) {
        actions.innerHTML = `
          <a class="adm-btn adm-btn-ghost adm-btn-sm" href="services.html">Services hub</a>
          <button type="button" class="adm-btn adm-btn-navy adm-btn-sm" id="exportBtn">Export JSON</button>
          <button type="button" class="adm-btn adm-btn-ghost adm-btn-sm" id="refreshBtn">Refresh</button>
        `;

        const chipHtml = [
          `<button type="button" class="adm-chip active" data-chip="">All services</button>`,
          ...SERVICES.filter((s, i, arr) => arr.findIndex((x) => x.filter === s.filter) === i).map(
            (s) =>
              `<button type="button" class="adm-chip" data-chip="${esc(s.filter)}">${esc(s.name)}</button>`
          ),
        ].join('');

        content.innerHTML = `
          <div class="adm-stats" id="stats"></div>
          <div class="adm-chip-row" id="serviceChips">${chipHtml}</div>
          <div class="adm-panel">
            <div class="adm-toolbar">
              <h2>Inbox</h2>
              <input class="adm-input" id="search" placeholder="Search name, phone, email…" style="max-width:240px" />
              <select class="adm-select" id="statusFilter" style="max-width:170px">
                <option value="">All statuses</option>
                ${STATUSES.map((s) => `<option value="${s}">${s.replace(/_/g, ' ')}</option>`).join('')}
              </select>
            </div>
            <div class="adm-table-wrap">
              <table class="adm-table">
                <thead>
                  <tr>
                    <th>When</th><th>Service</th><th>Name</th><th>Contact</th><th>Status</th>
                  </tr>
                </thead>
                <tbody id="leadsBody"></tbody>
              </table>
            </div>
          </div>

          <div class="adm-drawer-backdrop" id="drawerBg"></div>
          <aside class="adm-drawer" id="drawer" aria-hidden="true">
            <div class="adm-drawer-head">
              <div>
                <h2 id="drawerTitle">Lead</h2>
                <div id="drawerSub" class="muted"></div>
              </div>
              <button type="button" class="adm-btn adm-btn-ghost adm-btn-sm" id="closeDrawer">Close</button>
            </div>
            <div class="adm-drawer-body" id="drawerBody"></div>
          </aside>
        `;

        async function refresh() {
          const result = await SalarAPI.fetchLeads({ limit: 500 });
          if (!result.ok) {
            document.getElementById('leadsBody').innerHTML =
              `<tr><td colspan="5" class="adm-empty">Could not load leads (${esc(result.error)}).</td></tr>`;
            if (result.error === 'unauthorized') location.reload();
            return;
          }
          snapshot = result;
          renderStats();
          renderTable();
          if (activeId) openLead(activeId);
        }

        function renderStats() {
          const leads = snapshot.leads || [];
          const byStatus = (s) => leads.filter((l) => (l.status || 'new') === s).length;
          document.getElementById('stats').innerHTML = [
            ['New', byStatus('new')],
            ['Contacted', byStatus('contacted')],
            ['In progress', byStatus('in_progress')],
            ['All services', leads.length],
          ]
            .map(([label, n]) => `<div class="adm-stat"><strong>${n}</strong><span>${label}</span></div>`)
            .join('');
        }

        function filtered() {
          let rows = filterLeads(snapshot.leads || [], serviceFilter);
          const status = document.getElementById('statusFilter').value;
          const q = (document.getElementById('search').value || '').toLowerCase().trim();
          if (status) rows = rows.filter((l) => (l.status || 'new') === status);
          if (q) {
            rows = rows.filter((l) =>
              `${l.name || ''} ${l.phone || ''} ${l.email || ''} ${l.meta || ''} ${typeLabel(l.type)}`
                .toLowerCase()
                .includes(q)
            );
          }
          return rows;
        }

        function renderTable() {
          const rows = filtered();
          document.getElementById('leadsBody').innerHTML =
            rows
              .slice(0, 150)
              .map(
                (l) => `
            <tr data-id="${esc(l.id)}">
              <td>${esc((l.createdAt || '').slice(0, 16).replace('T', ' '))}</td>
              <td><span class="adm-badge">${esc(typeLabel(l.type))}</span></td>
              <td>${esc(l.name || '—')}<div class="muted">${esc(l.meta || '')}</div></td>
              <td>${esc(l.phone || '—')}<div class="muted">${esc(l.email || '')}</div></td>
              <td>${statusBadge(l.status)}</td>
            </tr>`
              )
              .join('') ||
            `<tr><td colspan="5" class="adm-empty">No leads for this service filter yet.</td></tr>`;

          document.querySelectorAll('#leadsBody tr[data-id]').forEach((tr) => {
            tr.addEventListener('click', () => openLead(tr.dataset.id));
          });
        }

        function closeDrawer() {
          activeId = null;
          document.getElementById('drawer').classList.remove('open');
          document.getElementById('drawerBg').classList.remove('open');
        }

        async function openLead(id) {
          activeId = id;
          const drawer = document.getElementById('drawer');
          const body = document.getElementById('drawerBody');
          document.getElementById('drawerBg').classList.add('open');
          drawer.classList.add('open');
          body.innerHTML = `<p class="adm-msg">Loading…</p>`;

          const result = await SalarAPI.fetchLead(id);
          if (!result.ok || !result.lead) {
            body.innerHTML = `<p class="adm-msg err">Could not load lead.</p>`;
            return;
          }

          const lead = result.lead;
          const notes = result.notes || [];
          const wa = whatsappLink(lead.phone, lead.name);
          const dataEntries = Object.entries(lead.data || {}).filter(
            ([k, v]) => v !== '' && v != null && k !== 'sk_hp'
          );

          document.getElementById('drawerTitle').textContent = lead.name || 'Lead';
          document.getElementById('drawerSub').textContent = `${typeLabel(lead.type)} · ${lead.status || 'new'}`;

          body.innerHTML = `
            <div class="adm-kv">
              <div><dt>Service</dt><dd>${esc(typeLabel(lead.type))}</dd></div>
              <div><dt>Phone</dt><dd>${esc(lead.phone || '—')}</dd></div>
              <div><dt>Email</dt><dd>${esc(lead.email || '—')}</dd></div>
              <div><dt>Meta</dt><dd>${esc(lead.meta || '—')}</dd></div>
              <div><dt>When</dt><dd>${esc((lead.createdAt || '').replace('T', ' ').slice(0, 19))}</dd></div>
            </div>

            <div class="adm-field">
              <label class="adm-label" for="statusSelect">Status</label>
              <select class="adm-select" id="statusSelect">
                ${STATUSES.map(
                  (s) =>
                    `<option value="${s}" ${s === (lead.status || 'new') ? 'selected' : ''}>${s.replace(/_/g, ' ')}</option>`
                ).join('')}
              </select>
            </div>

            <div class="adm-actions" style="margin-bottom:1rem">
              ${
                wa
                  ? `<a class="adm-btn adm-btn-gold adm-btn-sm" href="${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>`
                  : ''
              }
              ${
                lead.phone
                  ? `<button type="button" class="adm-btn adm-btn-ghost adm-btn-sm" id="copyPhone">Copy phone</button>`
                  : ''
              }
              ${
                lead.email
                  ? `<button type="button" class="adm-btn adm-btn-ghost adm-btn-sm" id="copyEmail">Copy email</button>`
                  : ''
              }
            </div>

            <div class="adm-field">
              <label class="adm-label" for="noteBody">Add note</label>
              <textarea class="adm-textarea" id="noteBody" placeholder="Call outcome, next step…"></textarea>
            </div>
            <button type="button" class="adm-btn adm-btn-navy adm-btn-sm" id="saveNote">Save note</button>
            <div class="adm-msg" id="drawerMsg"></div>

            <h3 style="margin:1.25rem 0 0.5rem;font-size:1rem;font-weight:800">Notes</h3>
            <ul class="adm-notes" id="notesList">
              ${
                notes
                  .map(
                    (n) =>
                      `<li><time>${esc((n.createdAt || '').replace('T', ' ').slice(0, 16))}</time>${esc(n.body)}</li>`
                  )
                  .join('') || '<li class="muted">No notes yet.</li>'
              }
            </ul>

            <h3 style="margin:1.25rem 0 0.5rem;font-size:1rem;font-weight:800">Form details</h3>
            <div class="adm-payload">${esc(
              dataEntries
                .map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`)
                .join('\n') || '—'
            )}</div>
          `;

          document.getElementById('statusSelect')?.addEventListener('change', async (e) => {
            const msg = document.getElementById('drawerMsg');
            msg.className = 'adm-msg';
            msg.textContent = 'Updating…';
            const res = await SalarAPI.updateLeadStatus(id, e.target.value);
            if (!res.ok) {
              msg.className = 'adm-msg err';
              msg.textContent = 'Could not update status.';
              return;
            }
            msg.className = 'adm-msg ok';
            msg.textContent = 'Status saved.';
            await refresh();
          });

          document.getElementById('saveNote')?.addEventListener('click', async () => {
            const text = document.getElementById('noteBody').value.trim();
            const msg = document.getElementById('drawerMsg');
            if (!text) {
              msg.className = 'adm-msg err';
              msg.textContent = 'Write a note first.';
              return;
            }
            msg.className = 'adm-msg';
            msg.textContent = 'Saving…';
            const res = await SalarAPI.addLeadNote(id, text);
            if (!res.ok) {
              msg.className = 'adm-msg err';
              msg.textContent = 'Could not save note.';
              return;
            }
            await openLead(id);
            await refresh();
          });

          document.getElementById('copyPhone')?.addEventListener('click', () => {
            navigator.clipboard?.writeText(lead.phone || '');
          });
          document.getElementById('copyEmail')?.addEventListener('click', () => {
            navigator.clipboard?.writeText(lead.email || '');
          });
        }

        document.getElementById('serviceChips')?.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-chip]');
          if (!btn) return;
          serviceFilter = btn.dataset.chip || '';
          document.querySelectorAll('#serviceChips .adm-chip').forEach((c) => c.classList.remove('active'));
          btn.classList.add('active');
          renderTable();
        });

        document.getElementById('refreshBtn')?.addEventListener('click', refresh);
        document.getElementById('exportBtn')?.addEventListener('click', () => {
          SalarAPI.exportJSON('sk-leads-export.json', snapshot);
        });
        document.getElementById('statusFilter')?.addEventListener('change', renderTable);
        document.getElementById('search')?.addEventListener('input', renderTable);
        document.getElementById('closeDrawer')?.addEventListener('click', closeDrawer);
        document.getElementById('drawerBg')?.addEventListener('click', closeDrawer);

        const params = new URLSearchParams(location.search);
        if (params.get('service')) {
          serviceFilter = params.get('service');
          document.querySelectorAll('#serviceChips .adm-chip').forEach((c) => {
            c.classList.toggle('active', (c.dataset.chip || '') === serviceFilter);
          });
        }

        await refresh();
      },
    });
  </script>
</body>
</html>
