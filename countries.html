  <title>Study & Work Destinations | 20 Countries Guides & Checklists | SK Immigration</title>
  <meta name="description" content="Explore 20 study and work destinations with SK Immigration — full guides, embassy-linked document checklists, cost calculator and country compare tool." />
    <meta property="og:type" content="website" />
  <meta property="og:title" content="Study Destinations | Country Guides | SK Immigration" />
  <meta property="og:description" content="Explore country guides for study and work pathways. Requirements, costs and timelines from SK Immigration Services." />

  <link rel="canonical" href="https://immigration.salaroutsourcing.com/countries" />
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" />

</head>
<body data-page="countries">
  <div class="bg-orbs" aria-hidden="true"></div>
  <div id="site-header"></div>
  <main id="main">
    <div class="page-hero container">
      <p class="eyebrow">Destinations</p>
      <h1 class="display">20 countries. Pick tools — not long pages.</h1>
      <p>Every destination has a deep guide, interactive checklist and cost band. Or <a class="text-gold" href="compare.html">compare two countries</a> in 30 seconds.</p>
      <div class="hero-ctas" style="justify-content:center;margin-top:1rem">
        <a class="btn btn-gold" href="checklist.html">Document checklist</a>
        <a class="btn btn-navy" href="calculator.html">Cost calculator</a>
        <a class="btn btn-ghost" href="eligibility.html">Eligibility quiz</a>
      </div>
    </div>
    <section>
      <div class="container">
        <div class="filters glass mb-2" style="padding:1rem">
          <input class="form-control" id="countrySearch" placeholder="Search country…" />
        </div>
        <div id="countryGrid" class="grid-3"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js?v=brandpolish1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('countryGrid');
      const countries = await (await fetch('assets/data/countries.json')).json();
      function render(list) {
        grid.innerHTML = list.map(c => {
          const slug = c.slug || '';
          const guide = slug ? `blog/${slug}/` : 'contact.html';
          return `
          <article class="glass card reveal visible">
            <div style="font-size:1.75rem">${c.flag}</div>
            <h3 style="margin:0.5rem 0 0.25rem;font-size:1.15rem;font-family:var(--font-display)">${c.name}</h3>
            <p class="text-muted" style="font-size:0.88rem">${c.blurb}</p>
            <div class="job-meta mt-1">${c.tags.map(t => `<span class="badge badge-muted">${t}</span>`).join('')}</div>
            <div class="hero-ctas" style="margin-top:1rem;margin-bottom:0;gap:0.4rem">
              <a class="btn btn-gold btn-sm" href="${guide}">Guide</a>
              <a class="btn btn-ghost btn-sm" href="checklist.html?country=${c.code}">Checklist</a>
              <a class="btn btn-ghost btn-sm" href="calculator.html?country=${c.code}">Costs</a>
            </div>
          </article>`;
        }).join('');
      }
      render(countries);
      document.getElementById('countrySearch')?.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        render(countries.filter(c => c.name.toLowerCase().includes(q) || c.tags.join(' ').toLowerCase().includes(q)));
      });
    });
  </script>
</body>
</html>
