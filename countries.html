  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('countryGrid');
      const countries = await (await fetch('assets/data/countries.json')).json();
      function render(list) {
        grid.innerHTML = list.map(c => {
          const slug = c.slug || '';
          const guide = slug ? `blog/${slug}/` : 'contact.html';
          return `
          <article class="glass card reveal visible">
            <div style="font-size:1.75rem">${c.flag}</div>
            <h3 style="margin:0.5rem 0 0.25rem;font-size:1.15rem;font-family:var(--font-display)">${c.name}</h3>
            <p class="text-muted" style="font-size:0.88rem">${c.blurb}</p>
            <div class="job-meta mt-1">${c.tags.map(t => `<span class="badge badge-muted">${t}</span>`).join('')}</div>
            <div class="hero-ctas" style="margin-top:1rem;margin-bottom:0;gap:0.4rem">
              <a class="btn btn-gold btn-sm" href="${guide}">Guide</a>
              <a class="btn btn-ghost btn-sm" href="checklist.html?country=${c.code}">Checklist</a>
              <a class="btn btn-ghost btn-sm" href="calculator.html?country=${c.code}">Costs</a>
            </div>
          </article>`;
        }).join('');
      }
      render(countries);
      document.getElementById('countrySearch')?.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        render(countries.filter(c => c.name.toLowerCase().includes(q) || c.tags.join(' ').toLowerCase().includes(q)));
      });
    });
  </script>
