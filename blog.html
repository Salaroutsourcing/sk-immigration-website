<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Immigration Blog | Guides, Solutions & Success Stories</title>
  <meta name="description" content="Practical immigration guides, problem-solution articles and success frameworks for global students and professionals." />
  <link rel="canonical" href="https://www.salaroutsourcing.com/blog" />
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" />
  <link rel="stylesheet" href="assets/css/main.css?v=navlabels1" />
</head>
<body data-page="blog">
  <div class="bg-orbs" aria-hidden="true"></div>
  <div id="site-header"></div>
  <main id="main">
    <div class="page-hero container">
      <p class="eyebrow">Blog</p>
      <h1 class="display">Guides that convert curiosity into clarity</h1>
      <p>Country guides, visa problem-solvers and career pathways — written for a global audience and optimized for search.</p>
      <div class="hero-ctas" style="justify-content:center;margin-top:1rem">
        <a class="btn btn-ghost btn-sm" href="admin/blog.html">Admin: manage posts</a>
      </div>
    </div>
    <section>
      <div class="container">
        <form class="filters glass mb-2" style="padding:1rem" onsubmit="location.search='?q='+encodeURIComponent(this.q.value);return false;">
          <input class="form-control" name="q" id="blogQ" placeholder="Search articles…" />
          <select class="form-control" id="blogCat" onchange="location.search=this.value?('?cat='+encodeURIComponent(this.value)):''">
            <option value="">All categories</option>
            <option>Guides</option>
            <option>Student Visa</option>
            <option>Work Permit</option>
            <option>Attestation</option>
            <option>Success Stories</option>
          </select>
        </form>
        <div id="blogList" class="grid-2"></div>
        <div class="ad-slot mt-3">In-feed ad / partner university spotlight</div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js?v=navlabels1"></script>
  <script src="assets/js/blog.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(location.search);
      if (params.get('q')) document.getElementById('blogQ').value = params.get('q');
      if (params.get('cat')) document.getElementById('blogCat').value = params.get('cat');
      SalarBlog.mountList('#blogList');
    });
  </script>
</body>
</html>
